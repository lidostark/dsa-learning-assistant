    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <!-- App Logic -->
    <script>
        // --- DATA STRUCTURE CURRICULUM DEFINITION ---
        const dsaCurriculum = [
            {
                category: "Arrays & Hashing",
                icon: "fa-solid fa-table-cells",
                subtopics: [
                    { id: "static-dynamic-arrays", name: "Static & Dynamic Arrays", prompt: "Explain static versus dynamic arrays. What are their time complexities for access, search, insertion, and deletion?" },
                    { id: "two-sum", name: "Two Sum Problem", prompt: "Explain the Two Sum problem. Walk through the brute force O(n^2) approach and the optimized O(n) hash map approach with Python code." },
                    { id: "reverse-array", name: "Reverse an Array", prompt: "Explain how to reverse an array in-place using the two-pointer technique in Python." }
                ]
            },
            {
                category: "Stacks & Queues",
                icon: "fa-solid fa-layer-group",
                subtopics: [
                    { id: "stack-list", name: "Stack via List/Deque", prompt: "Explain the Stack data structure. Show how to implement a Stack in Python using lists and collections.deque, highlighting push/pop operations." },
                    { id: "queue-deque", name: "Queue via Deque", prompt: "Explain the Queue data structure. Show how to implement a Queue in Python using collections.deque, highlighting enqueue/dequeue operations." },
                    { id: "valid-parentheses", name: "Valid Parentheses", prompt: "Explain the Valid Parentheses problem. Walk through how to solve it using a Stack in Python." }
                ]
            },
            {
                category: "Linked Lists",
                icon: "fa-solid fa-link",
                subtopics: [
                    { id: "singly-linked-list", name: "Singly Linked List", prompt: "Explain what a Singly Linked List is. Code a Node class and a LinkedList class in Python with insert_at_head and insert_at_tail methods." },
                    { id: "reverse-linked-list", name: "Reverse Linked List", prompt: "Explain how to reverse a Singly Linked List in-place. Show the iterative Python code step-by-step." }
                ]
            },
            {
                category: "Trees & Graphs",
                icon: "fa-solid fa-tree",
                subtopics: [
                    { id: "binary-tree-traversal", name: "Binary Tree Traversals", prompt: "Explain preorder, inorder, and postorder traversals of a binary search tree. Provide recursive Python implementation." },
                    { id: "binary-search-tree", name: "Binary Search Trees (BST)", prompt: "Explain the properties of a Binary Search Tree (BST). Code the insert and search methods in Python." },
                    { id: "dfs-bfs-graphs", name: "DFS & BFS in Graphs", prompt: "Explain Depth First Search (DFS) and Breadth First Search (BFS) for graph traversal. Provide standard Python implementations using an adjacency list." }
                ]
            },
            {
                category: "Sorting & Searching",
                icon: "fa-solid fa-arrow-down-9-1",
                subtopics: [
                    { id: "binary-search", name: "Binary Search Algorithm", prompt: "Explain Binary Search. What is its time complexity? Write the iterative and recursive implementations in Python." },
                    { id: "merge-sort", name: "Merge Sort Algorithm", prompt: "Explain the Divide and Conquer strategy. Code the Merge Sort algorithm in Python, showing how it merges subarrays." }
                ]
            },
            {
                category: "Dynamic Programming",
                icon: "fa-solid fa-puzzle-piece",
                subtopics: [
                    { id: "fibonacci-memoization", name: "Fibonacci Memoization", prompt: "Explain Dynamic Programming using Fibonacci. Show the recursive approach, the memoized approach (top-down), and the tabulated approach (bottom-up) in Python." },
                    { id: "coin-change", name: "Coin Change Problem", prompt: "Explain the Coin Change problem. Provide a bottom-up Dynamic Programming solution in Python with time/space complexity analysis." }
                ]
            }
        ];

        // --- STATE MANAGEMENT ---
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let completedSubtopics = JSON.parse(localStorage.getItem('completedSubtopics')) || [];
        let messagesHistory = [];
        let pyodideInstance = null;
        let isPyodideLoading = false;
        let currentUtterance = null;
        let isSpeaking = false;
        let activeSpeakerBtn = null;

        // --- DOM ELEMENTS ---
        const themeToggle = document.getElementById('theme-toggle');
        const toggleSidebar = document.getElementById('toggle-sidebar');
        const toggleSandbox = document.getElementById('toggle-sandbox');
        const curriculumListEl = document.getElementById('curriculum-list');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const resetSessionBtn = document.getElementById('reset-session-btn');
        const exportChatBtn = document.getElementById('export-chat-btn');
        const activeTopicText = document.getElementById('active-topic-indicator').querySelector('span');
        const progressFill = document.getElementById('course-progress-fill');
        const progressText = document.getElementById('progress-percentage');

        const tabBtnPlayground = document.getElementById('tab-btn-playground');
        const tabBtnVisualizer = document.getElementById('tab-btn-visualizer');
        const viewPlayground = document.getElementById('view-playground');
        const viewVisualizer = document.getElementById('view-visualizer');

        const clearConsoleBtn = document.getElementById('clear-console-btn');
        const runCodeBtn = document.getElementById('run-code-btn');
        const consoleOutput = document.getElementById('console-output');

        const visTypeSelect = document.getElementById('visualizer-type');
        const visDisplay = document.getElementById('visualizer-display');

        const voiceInputBtn = document.getElementById('voice-input-btn');
        const toastContainer = document.getElementById('toast-container');

        // --- INITS ---
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon();
        renderCurriculum();
        updateProgress();
        showWelcomeScreen();

        // Initialize CodeMirror Editor
        const codeEditor = CodeMirror.fromTextArea(document.getElementById('python-editor-textarea'), {
            mode: "python",
            theme: "material-ocean",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true,
            smartIndent: true,
            tabSize: 4,
            indentWithTabs: false,
            autoCloseBrackets: true
        });

        // Keyboard shortcut: Cmd/Ctrl+Enter to run code in sandbox
        codeEditor.addKeyMap({
            'Cmd-Enter': function () { if (!runCodeBtn.disabled) runCodeBtn.click(); },
            'Ctrl-Enter': function () { if (!runCodeBtn.disabled) runCodeBtn.click(); }
        });

        // Initialize Pyodide on Page Load
        initPyodide();

        // Auto-focus Input
        userInput.focus();

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            let iconClass = 'fa-circle-info';
            if (type === 'success') iconClass = 'fa-circle-check';
            if (type === 'error') iconClass = 'fa-circle-exclamation';

            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> ${message}`;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- THEME MANAGEMENT ---
        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            updateThemeIcon();
            showToast(`Switched to ${currentTheme} mode!`, 'info');
        });

        function updateThemeIcon() {
            const icon = themeToggle.querySelector('i');
            if (currentTheme === 'light') {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        // --- PANEL TOGGLES ---
        toggleSidebar.addEventListener('click', () => {
            document.body.classList.toggle('sidebar-collapsed');
            toggleSidebar.classList.toggle('active', !document.body.classList.contains('sidebar-collapsed'));
        });

        toggleSandbox.addEventListener('click', () => {
            document.body.classList.toggle('sandbox-collapsed');
            toggleSandbox.classList.toggle('active', !document.body.classList.contains('sandbox-collapsed'));
            // Refresh CodeMirror layout when sandbox expands
            setTimeout(() => codeEditor.refresh(), 305);
        });

        // --- TAB SWITCHER ---
        tabBtnPlayground.addEventListener('click', () => {
            tabBtnPlayground.classList.add('active');
            tabBtnVisualizer.classList.remove('active');
            viewPlayground.classList.add('active');
            viewVisualizer.classList.remove('active');
            setTimeout(() => codeEditor.refresh(), 50);
        });

        tabBtnVisualizer.addEventListener('click', () => {
            tabBtnVisualizer.classList.add('active');
            tabBtnPlayground.classList.remove('active');
            viewVisualizer.classList.add('active');
            viewPlayground.classList.remove('active');
            renderActiveVisualizer();
        });

        // --- SPEECH TOOLS ---

        // Text-to-Speech (Speaker)
        function speakMessage(text, btnElement) {
            if (window.speechSynthesis) {
                // If speaking is active, stop it
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    btnElement.classList.remove('playing');
                    btnElement.querySelector('i').className = 'fa-solid fa-volume-high';
                    if (activeSpeakerBtn === btnElement) return;
                }

                // Strip markdown styling, equations, and code blocks for clearer reading
                let cleanText = text
                    .replace(/```[\s\S]*?```/g, '[Code snippet skipped. Use the sandbox on the right to run it.]')
                    .replace(/`([^`]+)`/g, '$1')
                    .replace(/[*#_\\-]/g, '')
                    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');

                currentUtterance = new SpeechSynthesisUtterance(cleanText);
                currentUtterance.rate = 1.05;

                currentUtterance.onstart = () => {
                    isSpeaking = true;
                    activeSpeakerBtn = btnElement;
                    btnElement.classList.add('playing');
                    btnElement.querySelector('i').className = 'fa-solid fa-stop';
                };

                currentUtterance.onend = () => {
                    isSpeaking = false;
                    btnElement.classList.remove('playing');
                    btnElement.querySelector('i').className = 'fa-solid fa-volume-high';
                };

                currentUtterance.onerror = () => {
                    isSpeaking = false;
                    btnElement.classList.remove('playing');
                    btnElement.querySelector('i').className = 'fa-solid fa-volume-high';
                };

                window.speechSynthesis.speak(currentUtterance);
            } else {
                showToast("Speech synthesis not supported in this browser.", "error");
            }
        }

        // Speech-to-Text (Microphone)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                voiceInputBtn.classList.add('active-record');
                showToast("Listening...", "info");
            };

            recognition.onend = () => {
                voiceInputBtn.classList.remove('active-record');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = (userInput.value + ' ' + transcript).trim();
                userInput.dispatchEvent(new Event('input'));
            };

            recognition.onerror = (e) => {
                showToast("Speech recognition error: " + e.error, "error");
                voiceInputBtn.classList.remove('active-record');
            };

            voiceInputBtn.addEventListener('click', () => {
                if (voiceInputBtn.classList.contains('active-record')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            voiceInputBtn.style.display = 'none';
        }

        // --- PYODIDE (PYTHON COMPILER IN BROWSER) ---
        async function initPyodide() {
            if (pyodideInstance || isPyodideLoading) return;
            isPyodideLoading = true;
            appendToConsole("Loading Pyodide runtime (Python environment) in your browser...\n", "info");
            try {
                pyodideInstance = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.23.4/full/"
                });
                appendToConsole("Python environment initialized! Ready to run scripts.\n", "success");
                runCodeBtn.disabled = false;
            } catch (err) {
                appendToConsole(`Failed to load Python: ${err.message}\n`, "stderr");
                showToast("Pyodide loading failed.", "error");
            } finally {
                isPyodideLoading = false;
            }
        }

        function appendToConsole(text, type = '') {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = text;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        clearConsoleBtn.addEventListener('click', () => {
            consoleOutput.innerHTML = '';
            showToast("Console cleared.", "info");
        });

        runCodeBtn.addEventListener('click', async () => {
            if (!pyodideInstance) {
                showToast("Python engine is still loading...", "error");
                return;
            }

            const code = codeEditor.getValue();
            if (!code.trim()) {
                showToast("No code to execute.", "error");
                return;
            }

            // Show running state
            runCodeBtn.disabled = true;
            runCodeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Running...';
            appendToConsole(">>> Running code...", "info");

            // Redirect stdout and stderr to our virtual console
            pyodideInstance.setStdout({
                batched: (text) => {
                    appendToConsole(text);
                }
            });

            pyodideInstance.setStderr({
                batched: (text) => {
                    appendToConsole(text, 'stderr');
                }
            });

            try {
                const result = await pyodideInstance.runPythonAsync(code);
                if (result !== undefined && result !== null) {
                    appendToConsole(`Result: ${result}`, "success");
                }
                appendToConsole(">>> Execution complete.", "info");
            } catch (err) {
                appendToConsole(`${err.message}`, "stderr");
            } finally {
                runCodeBtn.disabled = false;
                runCodeBtn.innerHTML = '<i class="fa-solid fa-play"></i> Run Code';
            }
        });

        function openSandboxWithCode(code) {
            codeEditor.setValue(code);
            // Open panel if collapsed
            if (document.body.classList.contains('sandbox-collapsed')) {
                toggleSandbox.click();
            }
            // Switch to playground tab
            tabBtnPlayground.click();
            showToast("Copied script to Sandbox!", "success");
        }

        // --- CURRICULUM TRACKING ---
        function renderCurriculum() {
            curriculumListEl.innerHTML = '';
            dsaCurriculum.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'curriculum-category';

                catDiv.innerHTML = `
                    <div class="category-header">
                        <span class="category-title"><i class="${cat.icon}"></i> ${cat.category}</span>
                        <i class="fa-solid fa-chevron-down category-icon-chevron"></i>
                    </div>
                    <div class="category-body"></div>
                `;

                const body = catDiv.querySelector('.category-body');
                cat.subtopics.forEach(sub => {
                    const item = document.createElement('div');
                    item.className = 'subtopic-item';

                    const isChecked = completedSubtopics.includes(sub.id);

                    item.innerHTML = `
                        <div class="subtopic-left">
                            <input type="checkbox" class="subtopic-checkbox" id="chk-${sub.id}" ${isChecked ? 'checked' : ''}>
                            <span class="subtopic-label">${sub.name}</span>
                        </div>
                        <button class="subtopic-learn-btn" id="btn-learn-${sub.id}">
                            Learn <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    `;

                    // Bind learn button click
                    item.querySelector('.subtopic-learn-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        startLearningTopic(sub);
                    });

                    // Bind checkbox toggle click
                    const checkbox = item.querySelector('.subtopic-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        toggleTopicCompletion(sub.id, checkbox.checked);
                    });

                    // Make label/wrapper click trigger checkbox toggle
                    item.querySelector('.subtopic-left').addEventListener('click', (e) => {
                        if (e.target !== checkbox) {
                            checkbox.checked = !checkbox.checked;
                            checkbox.dispatchEvent(new Event('change'));
                        }
                    });

                    body.appendChild(item);
                });

                // Toggle expand/collapse category
                catDiv.querySelector('.category-header').addEventListener('click', () => {
                    const isOpen = catDiv.classList.contains('open');
                    // Close other opened categories
                    document.querySelectorAll('.curriculum-category').forEach(el => el.classList.remove('open'));
                    if (!isOpen) {
                        catDiv.classList.add('open');
                    }
                });

                curriculumListEl.appendChild(catDiv);
            });
        }

        function toggleTopicCompletion(id, isCompleted) {
            if (isCompleted) {
                if (!completedSubtopics.includes(id)) {
                    completedSubtopics.push(id);
                    // Confetti!
                    confetti({
                        particleCount: 80,
                        spread: 60,
                        origin: { y: 0.85 }
                    });
                    showToast("Topic checked off! Keep it up!", "success");
                }
            } else {
                completedSubtopics = completedSubtopics.filter(item => item !== id);
                showToast("Topic unmarked.", "info");
            }

            localStorage.setItem('completedSubtopics', JSON.stringify(completedSubtopics));
            updateProgress();
        }

        function updateProgress() {
            let totalSubtopics = 0;
            dsaCurriculum.forEach(cat => totalSubtopics += cat.subtopics.length);

            const completionPercent = totalSubtopics > 0
                ? Math.round((completedSubtopics.length / totalSubtopics) * 100)
                : 0;

            progressFill.style.width = `${completionPercent}%`;
            progressText.textContent = `${completionPercent}%`;
        }

        function startLearningTopic(subtopic) {
            activeTopicText.textContent = subtopic.name;
            userInput.value = subtopic.prompt;
            userInput.dispatchEvent(new Event('input'));
            sendMessage();
        }

        // --- CHAT SYSTEM ---
        function showWelcomeScreen() {
            chatMessages.innerHTML = `
                <div class="welcome-container">
                    <div class="welcome-icon"><i class="fa-solid fa-rocket"></i></div>
                    <h2>Start Your Python DSA Journey</h2>
                    <p>Welcome! I'm your interactive AI tutor. Ask me details on arrays, stacks, trees, sorting algorithms, and more. Write your scripts, test them in the sandbox, and trace them using our interactive visualizer.</p>
                    
                    <div class="welcome-suggestions">
                        <div class="suggestion-card" onclick="triggerSuggestion('How does a Stack differ from a Queue?')">
                            <h4><i class="fa-solid fa-layer-group" style="color: var(--color-primary);"></i> Stack vs Queue</h4>
                            <p>Learn the basics of LIFO and FIFO operations.</p>
                        </div>
                        <div class="suggestion-card" onclick="triggerSuggestion('Write dynamic programming code for coin change.')">
                            <h4><i class="fa-solid fa-puzzle-piece" style="color: var(--color-secondary);"></i> Dynamic Programming</h4>
                            <p>Understand recursive memoization in Python.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function triggerSuggestion(text) {
            userInput.value = text;
            userInput.dispatchEvent(new Event('input'));
            sendMessage();
        }

        function addMessageBubble(text, isUser) {
            // Remove welcome screen if it exists
            const welcome = chatMessages.querySelector('.welcome-container');
            if (welcome) welcome.remove();

            const bubbleWrapper = document.createElement('div');
            bubbleWrapper.className = `message-bubble-wrapper ${isUser ? 'user' : 'assistant'}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-brain"></i>';
            bubbleWrapper.appendChild(avatar);

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isUser) {
                bubble.textContent = text;
            } else {
                // Parse markdown for assistant messages
                bubble.innerHTML = marked.parse(text);

                // Add TTS controls for assistant replies
                const controls = document.createElement('div');
                controls.className = 'message-speech-controls';
                controls.innerHTML = `
                    <button class="speech-btn" title="Speak Message"><i class="fa-solid fa-volume-high"></i></button>
                `;
                controls.querySelector('.speech-btn').addEventListener('click', (e) => {
                    speakMessage(text, e.currentTarget);
                });
                bubble.appendChild(controls);
            }

            bubbleWrapper.appendChild(bubble);
            chatMessages.appendChild(bubbleWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!isUser) {
                // Decorate python blocks
                decorateCodeBlocks(bubbleWrapper);
            }
        }

        function showLoadingIndicator() {
            const bubbleWrapper = document.createElement('div');
            bubbleWrapper.className = 'message-bubble-wrapper assistant';
            bubbleWrapper.id = 'chat-loading-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fa-solid fa-brain"></i>';
            bubbleWrapper.appendChild(avatar);

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble loading-bubble';
            bubble.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            `;

            bubbleWrapper.appendChild(bubble);
            chatMessages.appendChild(bubbleWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideLoadingIndicator() {
            const indicator = document.getElementById('chat-loading-indicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Stop speech if speaking
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }

            addMessageBubble(text, true);
            userInput.value = '';
            userInput.style.height = '38px'; // Reset height
            sendBtn.disabled = true;

            showLoadingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                hideLoadingIndicator();

                if (data.response) {
                    addMessageBubble(data.response, false);
                    messagesHistory.push({ user: text, assistant: data.response });
                } else {
                    addMessageBubble(data.error || 'Oops, no response returned.', false);
                }
            } catch (error) {
                hideLoadingIndicator();
                addMessageBubble('Network error. Unable to contact the Flask server.', false);
                showToast("Failed to send message.", "error");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Decorate Code Snippets with Copy / Run Actions
        function decorateCodeBlocks(container) {
            const codeBlocks = container.querySelectorAll('pre code');
            codeBlocks.forEach(codeEl => {
                if (codeEl.parentElement.classList.contains('code-decorated')) return;

                const pre = codeEl.parentElement;
                pre.classList.add('code-decorated');

                const langClass = [...codeEl.classList].find(cls => cls.startsWith('language-'));
                const lang = langClass ? langClass.replace('language-', '') : 'code';

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';

                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `
                    <span class="code-lang"><i class="fa-brands fa-python"></i> ${lang}</span>
                    <div class="code-actions">
                        <button class="code-action-btn copy-btn"><i class="fa-regular fa-copy"></i> Copy</button>
                        ${lang === 'python' || lang === 'py' || lang === 'code' ? `
                            <button class="code-action-btn run-btn"><i class="fa-solid fa-terminal"></i> Run Sandbox</button>
                        ` : ''}
                    </div>
                `;

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);

                const codeText = codeEl.textContent;
                header.querySelector('.copy-btn').addEventListener('click', () => {
                    navigator.clipboard.writeText(codeText);
                    showToast("Code copied to clipboard!", "success");
                });

                const runInSandbox = header.querySelector('.run-btn');
                if (runInSandbox) {
                    runInSandbox.addEventListener('click', () => {
                        openSandboxWithCode(codeText);
                    });
                }
            });
        }

        // Auto-sizing dynamic textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = !userInput.value.trim();
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Reset conversation
        resetSessionBtn.addEventListener('click', async () => {
            if (confirm("Are you sure you want to clear this conversation history? This resets your session context.")) {
                try {
                    const response = await fetch('/reset', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'success') {
                        messagesHistory = [];
                        activeTopicText.textContent = "General Mentorship";
                        showWelcomeScreen();
                        showToast("Session reset successfully.", "success");
                    }
                } catch (err) {
                    showToast("Failed to reset session.", "error");
                }
            }
        });

        // Export markdown transcript
        exportChatBtn.addEventListener('click', () => {
            if (messagesHistory.length === 0) {
                showToast("No chat history to export.", "error");
                return;
            }

            let doc = "# DSA Assistant Conversation Transcript\n\n";
            messagesHistory.forEach((msg, idx) => {
                doc += `### Question ${idx + 1}\n**Student:** ${msg.user}\n\n`;
                doc += `**Tutor:**\n${msg.assistant}\n\n---\n\n`;
            });

            const blob = new Blob([doc], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dsa_learning_session_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Conversation exported!", "success");
        });

        // --- DATA STRUCTURE SIMULATOR IMPLEMENTATIONS ---
        let arrayData = [12, 45, 8, 23, 76];
        let stackData = ['34', '12', '90'];
        let queueData = ['A', 'B', 'C'];
        let linkedListData = ['Node A', 'Node B'];

        // --- BST STATE & FUNCTIONS ---
        class BSTNode {
            constructor(val) { this.val = val; this.left = null; this.right = null; }
        }
        let bstRoot = null;

        function bstInsert(val) {
            const newNode = new BSTNode(val);
            if (!bstRoot) { bstRoot = newNode; return; }
            let cur = bstRoot;
            while (true) {
                if (val < cur.val) {
                    if (!cur.left) { cur.left = newNode; return; }
                    cur = cur.left;
                } else if (val > cur.val) {
                    if (!cur.right) { cur.right = newNode; return; }
                    cur = cur.right;
                } else { return; } // duplicate
            }
        }

        function bstSearch(val) {
            let cur = bstRoot;
            while (cur) {
                if (val === cur.val) return true;
                cur = val < cur.val ? cur.left : cur.right;
            }
            return false;
        }

        // Initialize BST with demo values
        [50, 30, 70, 20, 40, 60, 80].forEach(v => bstInsert(v));

        function renderBST(highlightVal) {
            const container = document.createElement('div');
            container.className = 'bst-vis-container';

            if (!bstRoot) {
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                container.style.justifyContent = 'center';
                container.style.height = '100%';
                container.innerHTML = '<span class="bst-empty-label">Empty BST — Insert values to build the tree</span>';
                visDisplay.appendChild(container);
                return;
            }

            function getDepth(n) { if (!n) return 0; return 1 + Math.max(getDepth(n.left), getDepth(n.right)); }
            const depth = getDepth(bstRoot);
            const cWidth = visDisplay.clientWidth ? visDisplay.clientWidth - 30 : 400;
            const cHeight = Math.max(250, depth * 70);
            container.style.position = 'relative';
            container.style.width = cWidth + 'px';
            container.style.height = cHeight + 'px';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', cWidth);
            svg.setAttribute('height', cHeight);
            svg.style.position = 'absolute';
            svg.style.top = '0';
            svg.style.left = '0';
            svg.style.pointerEvents = 'none';
            container.appendChild(svg);

            function drawNode(node, x, y, spread) {
                if (!node) return;
                const nextY = y + 65;
                const nextSpread = Math.max(spread / 2, 20);

                if (node.left) {
                    const lx = x - spread;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x); line.setAttribute('y1', y);
                    line.setAttribute('x2', lx); line.setAttribute('y2', nextY);
                    line.setAttribute('class', 'bst-edge');
                    svg.appendChild(line);
                    drawNode(node.left, lx, nextY, nextSpread);
                }
                if (node.right) {
                    const rx = x + spread;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x); line.setAttribute('y1', y);
                    line.setAttribute('x2', rx); line.setAttribute('y2', nextY);
                    line.setAttribute('class', 'bst-edge');
                    svg.appendChild(line);
                    drawNode(node.right, rx, nextY, nextSpread);
                }

                const el = document.createElement('div');
                el.className = 'bst-node' + (highlightVal !== undefined && node.val === highlightVal ? ' highlight' : '');
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.textContent = node.val;
                container.appendChild(el);
            }

            drawNode(bstRoot, cWidth / 2, 35, cWidth / 4);
            visDisplay.appendChild(container);
        }

        // --- HASH TABLE STATE & FUNCTIONS ---
        const HASH_TABLE_SIZE = 8;
        let hashTable = Array.from({ length: HASH_TABLE_SIZE }, () => []);

        function simpleHash(key) {
            let h = 0;
            for (let i = 0; i < key.length; i++) {
                h = (h * 31 + key.charCodeAt(i)) % HASH_TABLE_SIZE;
            }
            return h;
        }

        function hashTablePut(key, value) {
            const idx = simpleHash(key);
            const existing = hashTable[idx].find(e => e.key === key);
            if (existing) { existing.value = value; }
            else { hashTable[idx].push({ key, value }); }
        }

        function hashTableDelete(key) {
            const idx = simpleHash(key);
            hashTable[idx] = hashTable[idx].filter(e => e.key !== key);
        }

        // Initialize hash table with demo data
        hashTablePut('name', 'Alice');
        hashTablePut('age', '25');
        hashTablePut('city', 'NYC');
        hashTablePut('lang', 'Python');
        hashTablePut('color', 'Blue');

        function renderHashTable() {
            const container = document.createElement('div');
            container.className = 'hashtable-vis-container';

            hashTable.forEach((bucket, idx) => {
                const row = document.createElement('div');
                row.className = 'ht-bucket';

                const indexEl = document.createElement('div');
                indexEl.className = 'ht-index';
                indexEl.textContent = idx;
                row.appendChild(indexEl);

                const arrow = document.createElement('span');
                arrow.className = 'ht-arrow';
                arrow.innerHTML = '&#x2192;';
                row.appendChild(arrow);

                const entries = document.createElement('div');
                entries.className = 'ht-entries';

                if (bucket.length === 0) {
                    const empty = document.createElement('span');
                    empty.className = 'ht-empty';
                    empty.textContent = '(empty)';
                    entries.appendChild(empty);
                } else {
                    bucket.forEach((entry, i) => {
                        if (i > 0) {
                            const chain = document.createElement('span');
                            chain.className = 'ht-arrow';
                            chain.innerHTML = '&#x2192;';
                            entries.appendChild(chain);
                        }
                        const entryEl = document.createElement('div');
                        entryEl.className = 'ht-entry';
                        entryEl.textContent = entry.key + ': ' + entry.value;
                        entries.appendChild(entryEl);
                    });
                }

                row.appendChild(entries);
                container.appendChild(row);
            });

            visDisplay.appendChild(container);
        }

        visTypeSelect.addEventListener('change', () => {
            // Hide all panels
            document.querySelectorAll('.visualizer-control-group').forEach(el => el.classList.remove('active'));
            // Display active panel
            const structure = visTypeSelect.value;
            document.getElementById(`ctrls-${structure}`).classList.add('active');
            renderActiveVisualizer();
        });

        function renderActiveVisualizer() {
            const structure = visTypeSelect.value;
            visDisplay.innerHTML = '';

            if (structure === 'array') {
                const container = document.createElement('div');
                container.className = 'array-vis-container';

                arrayData.forEach((val, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'array-element-box';

                    const box = document.createElement('div');
                    box.className = 'array-element';
                    box.id = `arr-cell-${idx}`;
                    box.textContent = val;

                    const label = document.createElement('span');
                    label.className = 'array-index';
                    label.textContent = `idx ${idx}`;

                    wrapper.appendChild(box);
                    wrapper.appendChild(label);
                    container.appendChild(wrapper);
                });
                visDisplay.appendChild(container);
            }
            else if (structure === 'stack') {
                const container = document.createElement('div');
                container.className = 'stack-vis-container';

                stackData.forEach((val, idx) => {
                    const block = document.createElement('div');
                    block.className = 'stack-element';
                    block.textContent = val;

                    if (idx === stackData.length - 1) {
                        const ptr = document.createElement('div');
                        ptr.className = 'stack-top-pointer';
                        ptr.innerHTML = `<span>TOP</span> <i class="fa-solid fa-arrow-right"></i>`;
                        block.appendChild(ptr);
                    }
                    container.appendChild(block);
                });

                if (stackData.length === 0) {
                    container.style.justifyContent = 'center';
                    container.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;">Empty Stack</span>';
                }
                visDisplay.appendChild(container);
            }
            else if (structure === 'queue') {
                const container = document.createElement('div');
                container.className = 'queue-vis-container';

                queueData.forEach((val, idx) => {
                    const block = document.createElement('div');
                    block.className = 'queue-element';
                    block.textContent = val;

                    let pText = '';
                    if (idx === 0) pText = 'Front (Head)';
                    if (idx === queueData.length - 1 && queueData.length > 1) pText = 'Rear (Tail)';
                    else if (idx === queueData.length - 1) pText = 'Front & Rear';

                    if (pText) {
                        const ptr = document.createElement('div');
                        ptr.className = 'queue-pointer';
                        ptr.innerHTML = `<i class="fa-solid fa-arrow-up"></i><span>${pText}</span>`;
                        block.appendChild(ptr);
                    }

                    container.appendChild(block);
                });

                if (queueData.length === 0) {
                    container.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;margin:auto;">Empty Queue</span>';
                }
                visDisplay.appendChild(container);
            }
            else if (structure === 'linkedlist') {
                const container = document.createElement('div');
                container.className = 'linkedlist-vis-container';

                linkedListData.forEach((val, idx) => {
                    const node = document.createElement('div');
                    node.className = 'll-node';

                    const label = idx === 0 ? 'Head' : (idx === linkedListData.length - 1 ? 'Tail' : `next`);
                    node.innerHTML = `
                        <div class="ll-val">${val}</div>
                        <div class="ll-next">${label}</div>
                    `;

                    container.appendChild(node);

                    // Add arrow pointing to next
                    const arrow = document.createElement('div');
                    arrow.className = 'll-arrow';
                    arrow.innerHTML = `<i class="fa-solid fa-arrow-right-long"></i>`;
                    container.appendChild(arrow);
                });

                const nil = document.createElement('div');
                nil.className = 'll-null';
                nil.textContent = 'NULL';
                container.appendChild(nil);

                visDisplay.appendChild(container);
            }
            else if (structure === 'binarytree') {
                renderBST();
            }
            else if (structure === 'hashtable') {
                renderHashTable();
            }
        }

        // Action controls mappings

        // --- ARRAY ACTIONS ---
        document.getElementById('btn-arr-append').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const val = parseInt(valInput.value);
            if (isNaN(val)) return showToast("Enter a numeric value.", "error");
            arrayData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Appended ${val} to list.`, "success");
        });

        document.getElementById('btn-arr-insert').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const idxInput = document.getElementById('arr-idx');
            const val = parseInt(valInput.value);
            const idx = parseInt(idxInput.value);

            if (isNaN(val) || isNaN(idx)) return showToast("Enter val and index.", "error");
            if (idx < 0 || idx > arrayData.length) return showToast("Index out of bounds.", "error");

            arrayData.splice(idx, 0, val);
            valInput.value = '';
            idxInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted ${val} at index ${idx}.`, "success");
        });

        document.getElementById('btn-arr-delete').addEventListener('click', () => {
            const idxInput = document.getElementById('arr-idx');
            const idx = parseInt(idxInput.value);

            if (isNaN(idx)) return showToast("Specify index to delete.", "error");
            if (idx < 0 || idx >= arrayData.length) return showToast("Index out of bounds.", "error");

            const removed = arrayData.splice(idx, 1);
            idxInput.value = '';
            renderActiveVisualizer();
            showToast(`Deleted ${removed[0]} from index ${idx}.`, "success");
        });

        document.getElementById('btn-arr-search').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const val = parseInt(valInput.value);
            if (isNaN(val)) return showToast("Enter search value.", "error");

            const matchIndex = arrayData.indexOf(val);
            renderActiveVisualizer(); // Reset highlights

            if (matchIndex !== -1) {
                const cell = document.getElementById(`arr-cell-${matchIndex}`);
                if (cell) {
                    cell.classList.add('highlight-search');
                    showToast(`Found ${val} at index ${matchIndex}!`, "success");
                }
            } else {
                showToast(`Value ${val} not found in array.`, "error");
            }
        });

        // --- STACK ACTIONS ---
        document.getElementById('btn-stack-push').addEventListener('click', () => {
            const valInput = document.getElementById('stack-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter a value to push.", "error");

            stackData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Pushed "${val}" to stack.`, "success");
        });

        document.getElementById('btn-stack-pop').addEventListener('click', () => {
            if (stackData.length === 0) return showToast("Stack Underflow! No items to pop.", "error");

            // Animation handling
            const containers = visDisplay.querySelectorAll('.stack-element');
            const topElement = containers[containers.length - 1];
            if (topElement) {
                topElement.classList.add('popping');
                setTimeout(() => {
                    const popped = stackData.pop();
                    renderActiveVisualizer();
                    showToast(`Popped "${popped}" from stack.`, "success");
                }, 300);
            }
        });

        document.getElementById('btn-stack-clear').addEventListener('click', () => {
            stackData = [];
            renderActiveVisualizer();
            showToast("Stack cleared.", "info");
        });

        // --- QUEUE ACTIONS ---
        document.getElementById('btn-queue-enqueue').addEventListener('click', () => {
            const valInput = document.getElementById('queue-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter enqueue value.", "error");

            queueData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Enqueued "${val}".`, "success");
        });

        document.getElementById('btn-queue-dequeue').addEventListener('click', () => {
            if (queueData.length === 0) return showToast("Queue Underflow! Empty queue.", "error");

            const firstCell = visDisplay.querySelector('.queue-element');
            if (firstCell) {
                firstCell.classList.add('dequeuing');
                setTimeout(() => {
                    const dequeued = queueData.shift();
                    renderActiveVisualizer();
                    showToast(`Dequeued "${dequeued}" from head.`, "success");
                }, 300);
            }
        });

        document.getElementById('btn-queue-clear').addEventListener('click', () => {
            queueData = [];
            renderActiveVisualizer();
            showToast("Queue cleared.", "info");
        });

        // --- LINKED LIST ACTIONS ---
        document.getElementById('btn-ll-head').addEventListener('click', () => {
            const valInput = document.getElementById('ll-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter value to insert.", "error");

            linkedListData.unshift(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted "${val}" at Head.`, "success");
        });

        document.getElementById('btn-ll-tail').addEventListener('click', () => {
            const valInput = document.getElementById('ll-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter value to insert.", "error");

            linkedListData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted "${val}" at Tail.`, "success");
        });

        document.getElementById('btn-ll-delhead').addEventListener('click', () => {
            if (linkedListData.length === 0) return showToast("Linked list is already empty.", "error");

            const removed = linkedListData.shift();
            renderActiveVisualizer();
            showToast(`Deleted head node containing "${removed}".`, "success");
        });

        document.getElementById('btn-ll-clear').addEventListener('click', () => {
            linkedListData = [];
            renderActiveVisualizer();
            showToast("Linked list cleared.", "info");
        });

        // --- BST ACTIONS ---
        document.getElementById('btn-bst-insert').addEventListener('click', () => {
            const val = parseInt(document.getElementById('bst-val').value);
            if (isNaN(val)) return showToast("Enter a numeric value.", "error");
            bstInsert(val);
            document.getElementById('bst-val').value = '';
            renderActiveVisualizer();
            showToast('Inserted ' + val + ' into BST.', 'success');
        });

        document.getElementById('btn-bst-search').addEventListener('click', () => {
            const val = parseInt(document.getElementById('bst-val').value);
            if (isNaN(val)) return showToast("Enter a value to search.", "error");
            visDisplay.innerHTML = '';
            renderBST(val);
            if (bstSearch(val)) {
                showToast('Found ' + val + ' in BST!', 'success');
            } else {
                showToast('Value ' + val + ' not found in BST.', 'error');
            }
        });

        document.getElementById('btn-bst-clear').addEventListener('click', () => {
            bstRoot = null;
            renderActiveVisualizer();
            showToast("BST cleared.", "info");
        });

        // --- HASH TABLE ACTIONS ---
        document.getElementById('btn-ht-put').addEventListener('click', () => {
            const key = document.getElementById('ht-key').value.trim();
            const value = document.getElementById('ht-value').value.trim();
            if (!key || !value) return showToast("Enter both key and value.", "error");
            hashTablePut(key, value);
            document.getElementById('ht-key').value = '';
            document.getElementById('ht-value').value = '';
            renderActiveVisualizer();
            showToast('Put "' + key + ': ' + value + '" into bucket ' + simpleHash(key) + '.', 'success');
        });

        document.getElementById('btn-ht-delete').addEventListener('click', () => {
            const key = document.getElementById('ht-key').value.trim();
            if (!key) return showToast("Enter a key to delete.", "error");
            const idx = simpleHash(key);
            const exists = hashTable[idx].some(e => e.key === key);
            if (!exists) return showToast('Key "' + key + '" not found.', 'error');
            hashTableDelete(key);
            document.getElementById('ht-key').value = '';
            renderActiveVisualizer();
            showToast('Deleted key "' + key + '" from bucket ' + idx + '.', 'success');
        });

        document.getElementById('btn-ht-clear').addEventListener('click', () => {
            hashTable = Array.from({ length: HASH_TABLE_SIZE }, () => []);
            renderActiveVisualizer();
            showToast("Hash table cleared.", "info");
