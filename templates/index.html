            userInput.style.height = '38px'; // Reset height
            sendBtn.disabled = true;
            
            showLoadingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                hideLoadingIndicator();

                if (data.response) {
                    addMessageBubble(data.response, false);
                    messagesHistory.push({ user: text, assistant: data.response });
                } else {
                    addMessageBubble(data.error || 'Oops, no response returned.', false);
                }
            } catch (error) {
                hideLoadingIndicator();
                addMessageBubble('Network error. Unable to contact the Flask server.', false);
                showToast("Failed to send message.", "error");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Decorate Code Snippets with Copy / Run Actions
        function decorateCodeBlocks(container) {
            const codeBlocks = container.querySelectorAll('pre code');
            codeBlocks.forEach(codeEl => {
                if (codeEl.parentElement.classList.contains('code-decorated')) return;
                
                const pre = codeEl.parentElement;
                pre.classList.add('code-decorated');
                
                const langClass = [...codeEl.classList].find(cls => cls.startsWith('language-'));
                const lang = langClass ? langClass.replace('language-', '') : 'code';
                
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';
                
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `
                    <span class="code-lang"><i class="fa-brands fa-python"></i> ${lang}</span>
                    <div class="code-actions">
                        <button class="code-action-btn copy-btn"><i class="fa-regular fa-copy"></i> Copy</button>
                        ${lang === 'python' || lang === 'py' || lang === 'code' ? `
                            <button class="code-action-btn run-btn"><i class="fa-solid fa-terminal"></i> Run Sandbox</button>
                        ` : ''}
                    </div>
                `;
                
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);
                
                const codeText = codeEl.textContent;
                header.querySelector('.copy-btn').addEventListener('click', () => {
                    navigator.clipboard.writeText(codeText);
                    showToast("Code copied to clipboard!", "success");
                });
                
                const runInSandbox = header.querySelector('.run-btn');
                if (runInSandbox) {
                    runInSandbox.addEventListener('click', () => {
                        openSandboxWithCode(codeText);
                    });
                }
            });
        }

        // Auto-sizing dynamic textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = !userInput.value.trim();
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Reset conversation
        resetSessionBtn.addEventListener('click', async () => {
            if (confirm("Are you sure you want to clear this conversation history? This resets your session context.")) {
                try {
                    const response = await fetch('/reset', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'success') {
                        messagesHistory = [];
                        activeTopicText.textContent = "General Mentorship";
                        showWelcomeScreen();
                        showToast("Session reset successfully.", "success");
                    }
                } catch (err) {
                    showToast("Failed to reset session.", "error");
                }
            }
        });

        // Export markdown transcript
        exportChatBtn.addEventListener('click', () => {
            if (messagesHistory.length === 0) {
                showToast("No chat history to export.", "error");
                return;
            }
            
            let doc = "# DSA Assistant Conversation Transcript\n\n";
            messagesHistory.forEach((msg, idx) => {
                doc += `### Question ${idx + 1}\n**Student:** ${msg.user}\n\n`;
                doc += `**Tutor:**\n${msg.assistant}\n\n---\n\n`;
            });
            
            const blob = new Blob([doc], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dsa_learning_session_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Conversation exported!", "success");
        });

        // --- DATA STRUCTURE SIMULATOR IMPLEMENTATIONS ---
        let arrayData = [12, 45, 8, 23, 76];
        let stackData = ['34', '12', '90'];
        let queueData = ['A', 'B', 'C'];
        let linkedListData = ['Node A', 'Node B'];

        visTypeSelect.addEventListener('change', () => {
            // Hide all panels
            document.querySelectorAll('.visualizer-control-group').forEach(el => el.classList.remove('active'));
            // Display active panel
            const structure = visTypeSelect.value;
            document.getElementById(`ctrls-${structure}`).classList.add('active');
            renderActiveVisualizer();
        });

        function renderActiveVisualizer() {
            const structure = visTypeSelect.value;
            visDisplay.innerHTML = '';
            
            if (structure === 'array') {
                const container = document.createElement('div');
                container.className = 'array-vis-container';
                
                arrayData.forEach((val, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'array-element-box';
                    
                    const box = document.createElement('div');
                    box.className = 'array-element';
                    box.id = `arr-cell-${idx}`;
                    box.textContent = val;
                    
                    const label = document.createElement('span');
                    label.className = 'array-index';
                    label.textContent = `idx ${idx}`;
                    
                    wrapper.appendChild(box);
                    wrapper.appendChild(label);
                    container.appendChild(wrapper);
                });
                visDisplay.appendChild(container);
            } 
            else if (structure === 'stack') {
                const container = document.createElement('div');
                container.className = 'stack-vis-container';
                
                stackData.forEach((val, idx) => {
                    const block = document.createElement('div');
                    block.className = 'stack-element';
                    block.textContent = val;
                    
                    if (idx === stackData.length - 1) {
                        const ptr = document.createElement('div');
                        ptr.className = 'stack-top-pointer';
                        ptr.innerHTML = `<span>TOP</span> <i class="fa-solid fa-arrow-right"></i>`;
                        block.appendChild(ptr);
                    }
                    container.appendChild(block);
                });
                
                if (stackData.length === 0) {
                    container.style.justifyContent = 'center';
                    container.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;">Empty Stack</span>';
                }
                visDisplay.appendChild(container);
            } 
            else if (structure === 'queue') {
                const container = document.createElement('div');
                container.className = 'queue-vis-container';
                
                queueData.forEach((val, idx) => {
                    const block = document.createElement('div');
                    block.className = 'queue-element';
                    block.textContent = val;
                    
                    let pText = '';
                    if (idx === 0) pText = 'Front (Head)';
                    if (idx === queueData.length - 1 && queueData.length > 1) pText = 'Rear (Tail)';
                    else if (idx === queueData.length - 1) pText = 'Front & Rear';
                    
                    if (pText) {
                        const ptr = document.createElement('div');
                        ptr.className = 'queue-pointer';
                        ptr.innerHTML = `<i class="fa-solid fa-arrow-up"></i><span>${pText}</span>`;
                        block.appendChild(ptr);
                    }
                    
                    container.appendChild(block);
                });
                
                if (queueData.length === 0) {
                    container.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;margin:auto;">Empty Queue</span>';
                }
                visDisplay.appendChild(container);
            } 
            else if (structure === 'linkedlist') {
                const container = document.createElement('div');
                container.className = 'linkedlist-vis-container';
                
                linkedListData.forEach((val, idx) => {
                    const node = document.createElement('div');
                    node.className = 'll-node';
                    
                    const label = idx === 0 ? 'Head' : (idx === linkedListData.length - 1 ? 'Tail' : `next`);
                    node.innerHTML = `
                        <div class="ll-val">${val}</div>
                        <div class="ll-next">${label}</div>
                    `;
                    
                    container.appendChild(node);
                    
                    // Add arrow pointing to next
                    const arrow = document.createElement('div');
                    arrow.className = 'll-arrow';
                    arrow.innerHTML = `<i class="fa-solid fa-arrow-right-long"></i>`;
                    container.appendChild(arrow);
                });
                
                const nil = document.createElement('div');
                nil.className = 'll-null';
                nil.textContent = 'NULL';
                container.appendChild(nil);
                
                visDisplay.appendChild(container);
            }
        }

        // Action controls mappings
        
        // --- ARRAY ACTIONS ---
        document.getElementById('btn-arr-append').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const val = parseInt(valInput.value);
            if (isNaN(val)) return showToast("Enter a numeric value.", "error");
            arrayData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Appended ${val} to list.`, "success");
        });
        
        document.getElementById('btn-arr-insert').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const idxInput = document.getElementById('arr-idx');
            const val = parseInt(valInput.value);
            const idx = parseInt(idxInput.value);
            
            if (isNaN(val) || isNaN(idx)) return showToast("Enter val and index.", "error");
            if (idx < 0 || idx > arrayData.length) return showToast("Index out of bounds.", "error");
            
            arrayData.splice(idx, 0, val);
            valInput.value = '';
            idxInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted ${val} at index ${idx}.`, "success");
        });

        document.getElementById('btn-arr-delete').addEventListener('click', () => {
            const idxInput = document.getElementById('arr-idx');
            const idx = parseInt(idxInput.value);
            
            if (isNaN(idx)) return showToast("Specify index to delete.", "error");
            if (idx < 0 || idx >= arrayData.length) return showToast("Index out of bounds.", "error");
            
            const removed = arrayData.splice(idx, 1);
            idxInput.value = '';
            renderActiveVisualizer();
            showToast(`Deleted ${removed[0]} from index ${idx}.`, "success");
        });

        document.getElementById('btn-arr-search').addEventListener('click', () => {
            const valInput = document.getElementById('arr-val');
            const val = parseInt(valInput.value);
            if (isNaN(val)) return showToast("Enter search value.", "error");
            
            const matchIndex = arrayData.indexOf(val);
            renderActiveVisualizer(); // Reset highlights
            
            if (matchIndex !== -1) {
                const cell = document.getElementById(`arr-cell-${matchIndex}`);
                if (cell) {
                    cell.classList.add('highlight-search');
                    showToast(`Found ${val} at index ${matchIndex}!`, "success");
                }
            } else {
                showToast(`Value ${val} not found in array.`, "error");
            }
        });

        // --- STACK ACTIONS ---
        document.getElementById('btn-stack-push').addEventListener('click', () => {
            const valInput = document.getElementById('stack-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter a value to push.", "error");
            
            stackData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Pushed "${val}" to stack.`, "success");
        });

        document.getElementById('btn-stack-pop').addEventListener('click', () => {
            if (stackData.length === 0) return showToast("Stack Underflow! No items to pop.", "error");
            
            // Animation handling
            const containers = visDisplay.querySelectorAll('.stack-element');
            const topElement = containers[containers.length - 1];
            if (topElement) {
                topElement.classList.add('popping');
                setTimeout(() => {
                    const popped = stackData.pop();
                    renderActiveVisualizer();
                    showToast(`Popped "${popped}" from stack.`, "success");
                }, 300);
            }
        });

        document.getElementById('btn-stack-clear').addEventListener('click', () => {
            stackData = [];
            renderActiveVisualizer();
            showToast("Stack cleared.", "info");
        });

        // --- QUEUE ACTIONS ---
        document.getElementById('btn-queue-enqueue').addEventListener('click', () => {
            const valInput = document.getElementById('queue-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter enqueue value.", "error");
            
            queueData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Enqueued "${val}".`, "success");
        });

        document.getElementById('btn-queue-dequeue').addEventListener('click', () => {
            if (queueData.length === 0) return showToast("Queue Underflow! Empty queue.", "error");
            
            const firstCell = visDisplay.querySelector('.queue-element');
            if (firstCell) {
                firstCell.classList.add('dequeuing');
                setTimeout(() => {
                    const dequeued = queueData.shift();
                    renderActiveVisualizer();
                    showToast(`Dequeued "${dequeued}" from head.`, "success");
                }, 300);
            }
        });

        document.getElementById('btn-queue-clear').addEventListener('click', () => {
            queueData = [];
            renderActiveVisualizer();
            showToast("Queue cleared.", "info");
        });

        // --- LINKED LIST ACTIONS ---
        document.getElementById('btn-ll-head').addEventListener('click', () => {
            const valInput = document.getElementById('ll-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter value to insert.", "error");
            
            linkedListData.unshift(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted "${val}" at Head.`, "success");
        });

        document.getElementById('btn-ll-tail').addEventListener('click', () => {
            const valInput = document.getElementById('ll-val');
            const val = valInput.value.trim();
            if (!val) return showToast("Enter value to insert.", "error");
            
            linkedListData.push(val);
            valInput.value = '';
            renderActiveVisualizer();
            showToast(`Inserted "${val}" at Tail.`, "success");
        });

        document.getElementById('btn-ll-delhead').addEventListener('click', () => {
            if (linkedListData.length === 0) return showToast("Linked list is already empty.", "error");
            
            const removed = linkedListData.shift();
            renderActiveVisualizer();
            showToast(`Deleted head node containing "${removed}".`, "success");
        });

        document.getElementById('btn-ll-clear').addEventListener('click', () => {
            linkedListData = [];
            renderActiveVisualizer();
            showToast("Linked list cleared.", "info");
        });

    </script>
</body>
</html>
